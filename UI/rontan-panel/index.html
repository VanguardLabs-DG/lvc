<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Giroflex Rontan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .panel-wrap {
            padding: 10px;
            width: 100%;
            max-width: 520px;
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: none;
            transform-origin: bottom right;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.9));
        }

        .btn-shape {
            cursor: pointer;
            transition: all 0.15s ease;
            stroke-linejoin: round;
            filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.5));
        }

        .btn-shape:hover {
            filter: brightness(1.15) drop-shadow(0 5px 6px rgba(0, 0, 0, 0.6));
        }

        .btn-shape:active {
            filter: brightness(0.9) drop-shadow(0 1px 1px rgba(0, 0, 0, 0.9));
            transform: translateY(1px);
        }

        .btn-text {
            font-size: 11px;
            font-weight: 700;
            fill: #0a1f0a;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            letter-spacing: 0.5px;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .btn-text-red {
            fill: #1f0a0a;
        }

        .text-lit {
            filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.4));
        }

        .led {
            transition: all 0.2s ease;
        }
    </style>
</head>

    <script>
        (function() {
            let isPowerOn = false;
            let audioPlayer = null;
            let soundID = 0;
            let scale = 0.6;
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

            const panelWrap = document.querySelector('.panel-wrap');
            const masterSwitch = document.getElementById('master-switch');
            const switchSlider = document.getElementById('switch-slider');

            const backup = {
                left: panelWrap ? panelWrap.style.left : '',
                top: panelWrap ? panelWrap.style.top : ''
            };

            function sendData(name, data) {
                fetch(`https://lvc/${name}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                    body: JSON.stringify(data !== undefined ? (typeof data === 'object' ? data : { scale: data }) : {})
                }).catch(() => {});
            }

            function playSound(file, volume) {
                if (audioPlayer != null) {
                    audioPlayer.pause();
                }
                soundID++;
                audioPlayer = new Audio("../sounds/" + file + ".ogg");
                audioPlayer.volume = volume !== undefined ? volume : 0.5;
                const promise = audioPlayer.play();
                if (promise !== undefined) {
                    promise.catch(() => { audioPlayer = null; });
                }
            }

            function setButtonState(btnName, state) {
                const group = document.querySelector(`.btn-group[data-btn="${btnName}"]`);
                if (!group) return;
                const shape = group.querySelector('.btn-shape');
                if (!shape) return;

                let color = group.dataset.color || (btnName === 'btn1' ? 'r' : 'g');
                const onGrad = color === 'r' ? 'url(#rOn)' : 'url(#gOn)';
                const offGrad = color === 'r' ? 'url(#rOff)' : 'url(#gOff)';

                shape.setAttribute('fill', state ? onGrad : offGrad);

                const dark = color === 'r' ? '#1f0a0a' : '#0a1f0a';
                const darker = color === 'r' ? '#330505' : '#052a05';

                const childElements = group.querySelectorAll('.btn-text, circle:not(.led), path:not(.btn-shape), line, rect:not(.btn-shape)');
                childElements.forEach(el => {
                    if (state) {
                        el.classList.add('text-lit');
                    } else {
                        el.classList.remove('text-lit');
                    }
                    if (el.tagName === 'text') el.setAttribute('fill', state ? dark : darker);
                    if (el.tagName === 'path' || el.tagName === 'line') {
                        if (el.hasAttribute('stroke')) el.setAttribute('stroke', state ? dark : darker);
                        if (el.hasAttribute('fill') && el.getAttribute('fill') !== 'none') el.setAttribute('fill', state ? dark : darker);
                    }
                    if (el.tagName === 'circle') el.setAttribute('stroke', dark);
                    if (el.tagName === 'rect') el.setAttribute('fill', dark);
                });
                updateLeds();
            }

            function setMasterPower(state) {
                isPowerOn = state;
                if (switchSlider) switchSlider.style.transform = isPowerOn ? 'translate(36px, 0)' : 'translate(0px, 0)';
                if (!isPowerOn) {
                    allOff();
                }
                updateLeds();
            }

            function allOff() {
                document.querySelectorAll('.btn-shape').forEach(s => {
                    const g = s.parentElement;
                    if (!g || g.dataset.btn === 'off') return;
                    const isRed = (g.dataset.btn === 'btn1' || g.dataset.color === 'r');
                    s.setAttribute('fill', isRed ? 'url(#rOff)' : 'url(#gOff)');
                });

                document.querySelectorAll('.btn-group').forEach(g => {
                    if (g.dataset.btn === 'off') return;
                    const isRed = (g.dataset.btn === 'btn1' || g.dataset.color === 'r');
                    const dark = isRed ? '#1f0a0a' : '#0a1f0a';

                    const childElements = g.querySelectorAll('.btn-text, circle:not(.led), path:not(.btn-shape), line, rect:not(.btn-shape)');
                    childElements.forEach(el => {
                        el.classList.remove('text-lit');
                        if (el.tagName === 'text') el.setAttribute('fill', dark);
                        if (el.tagName === 'path' || el.tagName === 'line') {
                            if (el.hasAttribute('stroke')) el.setAttribute('stroke', dark);
                            if (el.hasAttribute('fill') && el.getAttribute('fill') !== 'none') el.setAttribute('fill', dark);
                        }
                        if (el.tagName === 'circle') el.setAttribute('stroke', dark);
                        if (el.tagName === 'rect') el.setAttribute('fill', dark);
                    });
                });

                updateLeds();
            }

            function updateLeds(taPattern) {
                const onCount = [...document.querySelectorAll('.btn-shape')].filter(s => {
                    const f = s.getAttribute('fill');
                    return f === 'url(#gOn)' || f === 'url(#rOn)';
                }).length;

                document.querySelectorAll('#leds-top .led').forEach((led, i) => {
                    let lit = false;
                    if (taPattern !== undefined && taPattern > 0) {
                        if (taPattern === 1) lit = i < 3;
                        else if (taPattern === 2) lit = i >= 6;
                        else if (taPattern === 3) lit = (i >= 3 && i <= 5);
                    } else {
                        lit = isPowerOn && (onCount > 0 && i < Math.min(onCount + 2, 9));
                    }
                    led.setAttribute('fill', lit ? 'url(#ledOnA)' : 'url(#ledOff)');
                    led.setAttribute('filter', lit ? 'url(#glowA)' : '');
                });

                document.querySelectorAll('#leds-bot .led').forEach((led, i) => {
                    const lit = isPowerOn && (onCount > 0);
                    led.setAttribute('fill', lit ? 'url(#ledOnR)' : 'url(#ledOff)');
                    led.setAttribute('filter', lit ? 'url(#glowR)' : '');
                });
            }

            if (masterSwitch) {
                masterSwitch.addEventListener('click', () => {
                    setMasterPower(!isPowerOn);
                    sendData('hud:toggleMaster', { state: isPowerOn });
                });
            }

            document.querySelectorAll('.btn-group').forEach(btn => {
                const btnName = btn.dataset.btn;

                btn.addEventListener('click', function () {
                    if (btnName === 'off') {
                        allOff();
                        sendData('hud:clickButton', { button: 'off' });
                        return;
                    }
                    sendData('hud:clickButton', { button: btnName });
                });

                if (btnName === 'man' || btnName === 'horn') {
                    btn.addEventListener('mousedown', function () {
                        sendData('hud:pressButton', { button: btnName });
                    });
                    btn.addEventListener('mouseup', function () {
                        sendData('hud:releaseButton', { button: btnName });
                    });
                }
            });

            window.addEventListener('message', function (event) {
                const data = event.data;
                if (!data) return;
                const type = data._type;

                if (type === 'audio') {
                    playSound(data.file, data.volume);
                } else if (type === 'hud:setItemState') {
                    const item = data.item;
                    const state = data.state;

                    if (item === 'hud') {
                        if (panelWrap) panelWrap.style.display = state ? 'block' : 'none';
                    } else if (item === 'switch') {
                        setMasterPower(state === true || state === 1);
                    } else if (item === 'siren') {
                        if (state === false || state === 0) {
                            setButtonState('wail', false);
                            setButtonState('yelp', false);
                            setButtonState('hilo', false);
                            setButtonState('pierce', false);
                        } else if (state === true) {
                            setButtonState('wail', true);
                            setButtonState('yelp', false);
                            setButtonState('hilo', false);
                            setButtonState('pierce', false);
                        } else if (typeof state === 'number') {
                            setButtonState('wail', state === 2);
                            setButtonState('yelp', state === 3);
                            setButtonState('hilo', state === 4);
                            setButtonState('pierce', state >= 5);
                        }
                    } else if (item === 'horn') {
                        setButtonState('horn', state);
                    } else if (item === 'man') {
                        setButtonState('man', state);
                    } else if (item === 'tkd') {
                        setButtonState('aux3', state);
                    } else if (item === 'lock') {
                        setButtonState('cruise', state);
                    } else if (item === 'ta') {
                        updateLeds(state);
                    } else if (item === 'aux1') {
                        setButtonState('aux1', state);
                    } else if (item === 'aux2') {
                        setButtonState('aux2', state);
                    } else if (item === 'aux3') {
                        setButtonState('aux3', state);
                    } else if (item === 'pursuit') {
                        setButtonState('pursuit', state);
                    } else if (item === 'emerg') {
                        setButtonState('emerg', state);
                    } else if (item === 'cutfront') {
                        setButtonState('cutfront', state);
                    } else if (item === 'cutrear') {
                        setButtonState('cutrear', state);
                    } else if (item === 'cruise') {
                        setButtonState('cruise', state);
                    }
                } else if (type === 'hud:setHudScale') {
                    scale = data.scale;
                    if (panelWrap) panelWrap.style.transform = `scale(${scale})`;
                } else if (type === 'hud:getHudScale') {
                    sendData('hud:sendHudScale', scale);
                } else if (type === 'hud:setHudPosition') {
                    if (data.pos && panelWrap) {
                        panelWrap.style.left = data.pos.left;
                        panelWrap.style.top = data.pos.top;
                    }
                } else if (type === 'hud:resetPosition') {
                    if (panelWrap) {
                        panelWrap.style.left = backup.left;
                        panelWrap.style.top = backup.top;
                    }
                }
            });

            document.addEventListener('keyup', (e) => {
                if (e.keyCode === 27 || e.keyCode === 9 || e.keyCode === 32) {
                    if (panelWrap) sendData('hud:setHudPositon', { left: panelWrap.style.left, top: panelWrap.style.top });
                    sendData('hud:setMoveState', false);
                }
            });

            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                if (panelWrap) sendData('hud:setHudPositon', { left: panelWrap.style.left, top: panelWrap.style.top });
                sendData('hud:setMoveState', false);
            });

            if (panelWrap) {
                panelWrap.onmousedown = dragMouseDown;
            }

            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                if (panelWrap) {
                    panelWrap.style.top = (panelWrap.offsetTop - pos2) + "px";
                    panelWrap.style.left = (panelWrap.offsetLeft - pos1) + "px";
                }
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        })();
    </script>
</body>

</html>
